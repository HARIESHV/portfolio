    <link
      rel="preload"
      href="/fonts/outfit-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Sets the initial theme before React mounts, avoiding a flash. -->
    <script>
      document.documentElement.style.backgroundColor = '#FAFDF7';
    </script>
